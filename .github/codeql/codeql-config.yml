name: "NexusForce CodeQL Configuration"

disable-default-queries: false

queries:
  - uses: security-and-quality

query-filters:
  - exclude:
      id: cpp/unused-static-variable
  - exclude:
      id: cpp/unused-static-function
  - exclude:
      id: cpp/unused-local-variable
  - exclude:
      id: cpp/useless-expression
  - exclude:
      id: cpp/non-https-url

  - exclude:
      id: cpp/array-in-interface
  - exclude:
      id: cpp/long-switch
  - exclude:
      id: cpp/commented-out-code
  - exclude:
      id: cpp/complex-condition
  - exclude:
      id: cpp/large-parameter
  - exclude:
      id: cpp/stack-address-escape
  - exclude:
      id: cpp/empty-if
  - exclude:
      id: cpp/poorly-documented-function

paths:
  - src
  - include

paths-ignore:
  - '**/vcpkg/**'
  - '**/vcpkg_installed/**'
  - '**/build/**'
  - cmake
  - docs
  - examples
  - tests
  - build
  - third_party
  - submodules