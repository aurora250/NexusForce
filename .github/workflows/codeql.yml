name: "CodeQL Analysis"

on:
  push:
    branches: [ dev ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'examples/**'
  pull_request:
    branches: [ dev ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'examples/**'
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'cpp' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y bear libtirpc-dev libc++abi-dev

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ~/vcpkg
            ~/.cache/vcpkg
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Setup vcpkg
        run: |
          if [ ! -d "$HOME/vcpkg" ]; then
            git clone https://github.com/Microsoft/vcpkg.git $HOME/vcpkg
            $HOME/vcpkg/bootstrap-vcpkg.sh
          fi
          echo "VCPKG_ROOT=$HOME/vcpkg" >> $GITHUB_ENV
          echo "$HOME/vcpkg" >> $GITHUB_PATH

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          build-mode: manual
          tools: latest
          config: |
            paths:
              - src
              - include
            paths-ignore:
              - '**/vcpkg/**'
              - '**/vcpkg_installed/**'
              - '**/build/_deps/**'
              - cmake
              - docs
              - examples
              - tests
              - build
              - third_party
              - submodules

      - name: Capture Build with Bear
        run: |
          mkdir -p build
          cd build

          bear -- cmake .. \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE=$HOME/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DNEXUSFORCE_BUILD_DOCS=OFF \
            -DNEXUSFORCE_BUILD_TESTS=OFF || true

          bear -- make -j$(nproc) || true

          if [ -f compile_commands.json ]; then
            echo "✅ compile_commands.json generated successfully"
            echo "=== Files captured (first 10) ==="

            set +e
            cat compile_commands.json | grep -o '"file": "[^"]*"' | head -10
            set -e
            echo "================================="

            TOTAL=$(cat compile_commands.json | grep -o '"file": "[^"]*"' | wc -l)
            echo "Total files captured: $TOTAL"
          else
            echo "⚠️ compile_commands.json not found"
          fi
        shell: bash

      - name: Clean Environment for CodeQL
        run: |
          unset CODEQL_PATH
          unset CODEQL_DIST
          unset CODEQL_JAVA_HOME
        shell: bash

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          upload: true
          cleanup-level: brutal
