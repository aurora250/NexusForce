name: "CodeQL Analysis"

on:
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'cpp' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y bear libtirpc-dev libc++abi-dev

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgJsonGlob: '**/vcpkg.json'
          vcpkgGitCommit: '2024.03.25'

      - name: Set VCPKG_ROOT environment variable
        run: echo "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> $GITHUB_ENV

      - name: Install dependencies via vcpkg
        run: |
          $HOME/vcpkg/vcpkg install --triplet x64-linux

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          build-mode: manual
          config: |
            paths:
              - src
              - include
            paths-ignore:
              - cmake
              - docs
              - examples
              - tests
              - build
              - vcpkg
              - third_party
              - submodules

      - name: Capture Build with Bear
        run: |
          mkdir -p build
          cd build

          bear -- cmake .. \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE=$HOME/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DCONFIG_BUILD_TESTS=OFF \
            -DCONFIG_BUILD_DOCS=OFF || true
          
          bear -- make -j$(nproc) || true

          if [ -f compile_commands.json ]; then
            echo "✅ compile_commands.json generated successfully"
            echo "Files captured:"
            cat compile_commands.json | grep -o '"file": "[^"]*"' | head -10
          else
            echo "⚠️ compile_commands.json not found"
          fi
        shell: bash

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2
        with:
          category: "/language:${{ matrix.language }}"
          upload: true
