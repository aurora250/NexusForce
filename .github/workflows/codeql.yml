name: "CodeQL Analysis"

on:
  push:
    branches: [ dev ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'vcpkg.json'
      - 'config.json'
      - '.github/workflows/codeql.yml'
      - '.github/codeql/codeql-config.yml'
  pull_request:
    branches: [ dev ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'vcpkg.json'
      - 'config.json'
      - '.github/workflows/codeql.yml'
      - '.github/codeql/codeql-config.yml'
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write

    # Overlay-base databases are write-only for this repository: their cache key
    # includes the commit SHA and workflow run id, so every run writes a new entry
    # that a later run cannot restore. They only exist to speed up PR overlay
    # analysis, but the repository's useful vcpkg caches compete for the same
    # 10 GB Actions cache quota. Disable overlay analysis to stop the leak.
    env:
      CODEQL_ACTION_OVERLAY_ANALYSIS: "false"

    strategy:
      fail-fast: false
      matrix:
        language: [ 'cpp' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Manual extraction runs one CodeQL extractor per translation unit. With ~240
      # template-heavy library TUs the resulting database made the analysis step exceed the
      # 360 minute job limit while the build itself reported success, so the job was killed
      # with no failing step to point at. "none" has CodeQL parse the paths declared in
      # codeql-config.yml directly: no build, no bear, no vcpkg bootstrap, and no per-TU
      # extraction. Trade-off: less interprocedural dataflow than a traced build provides,
      # which is the documented path for repositories that cannot fit manual mode in the
      # job limit.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          build-mode: none
          tools: latest
          config-file: .github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          upload: true
          cleanup-level: brutal
