name: "CodeQL Analysis"

on:
  push:
    branches: [ dev ]
    paths:
      - 'src/**'
      - 'include/**'
  pull_request:
    branches: [ dev ]
    paths:
      - 'src/**'
      - 'include/**'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'cpp' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Install Bear
        run: sudo apt-get update && sudo apt-get install -y bear

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          build-mode: manual
          config: |
            paths:
              - src
              - include
            paths-ignore:
              - cmake
              - docs
              - examples
              - tests
              - build
              - vcpkg
              - third_party
              - submodules

      - name: Build with CodeQL Tracing and Bear
        run: |
          mkdir -p build
          cd build

          source /opt/hostedtoolcache/CodeQL/*/x64/codeql/codeql env -output=/tmp/codeql_env.sh
          source /tmp/codeql_env.sh

          bear -- cmake .. -DCMAKE_BUILD_TYPE=Debug || true
        shell: bash

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2
        with:
          category: "/language:${{ matrix.language }}"
          upload: true
