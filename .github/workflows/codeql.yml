name: "CodeQL Analysis"

on:
  push:
    branches: [ dev ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'vcpkg.json'
      - 'config.json'
      - '.github/workflows/codeql.yml'
      - '.github/codeql/codeql-config.yml'
  pull_request:
    branches: [ dev ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'vcpkg.json'
      - 'config.json'
      - '.github/workflows/codeql.yml'
      - '.github/codeql/codeql-config.yml'
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'cpp' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y bear libtirpc-dev libc++abi-dev liburing-dev

      - name: Setup vcpkg
        id: vcpkg
        uses: ./.github/actions/setup-vcpkg

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          build-mode: manual
          tools: latest
          config-file: .github/codeql/codeql-config.yml

      - name: Capture Build with Bear
        run: |
          BUILD_DIR=$(mktemp -d)
          echo "BUILD_DIR=$BUILD_DIR" >> $GITHUB_ENV

          bear -- cmake -S . -B "$BUILD_DIR" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DNEXUSFORCE_BUILD_DOCS=OFF \
            -DNEXUSFORCE_BUILD_TESTS=OFF || true

          bear -- cmake --build "$BUILD_DIR" -j$(nproc) || true

          if [ -f compile_commands.json ]; then
            echo "✅ compile_commands.json generated successfully"
            echo "=== Files captured (first 10) ==="

            set +e
            cat compile_commands.json | grep -o '"file": "[^"]*"' | head -10
            set -e
            echo "================================="

            TOTAL=$(cat compile_commands.json | grep -o '"file": "[^"]*"' | wc -l)
            echo "Total files captured: $TOTAL"
          else
            echo "⚠️ compile_commands.json not found"
          fi

          rm -rf "$BUILD_DIR"
        shell: bash

      - name: Save vcpkg binary cache
        uses: ./.github/actions/save-vcpkg-cache
        with:
          cache-key: ${{ steps.vcpkg.outputs.cache-key }}
          cache-hit: ${{ steps.vcpkg.outputs.cache-hit }}
          binary-cache: ${{ steps.vcpkg.outputs.binary-cache }}
          tool-cache-key: ${{ steps.vcpkg.outputs.tool-cache-key }}
          tool-cache-hit: ${{ steps.vcpkg.outputs.tool-cache-hit }}
          vcpkg-tool-cache-path: ${{ steps.vcpkg.outputs.vcpkg-tool-cache-path }}

      - name: Clean Environment for CodeQL
        run: |
          unset CODEQL_PATH
          unset CODEQL_DIST
          unset CODEQL_JAVA_HOME
        shell: bash

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          upload: true
          cleanup-level: brutal
