name: "Valgrind Memory Leak Check"

on:
  push:
    branches: [ dev ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'examples/**'
      - 'tools/**'
      - 'benchmark/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'vcpkg.json'
      - 'config.json'
      - '.github/workflows/valgrind.yml'
      - 'valgrind.supp'
  pull_request:
    branches: [ dev ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'examples/**'
      - 'tools/**'
      - 'benchmark/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'vcpkg.json'
      - 'config.json'
      - '.github/workflows/valgrind.yml'
      - 'valgrind.supp'
  workflow_dispatch:

jobs:
  valgrind:
    name: Valgrind Memcheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind libtirpc-dev libc++abi-dev liburing-dev

      - name: Setup vcpkg
        id: vcpkg
        uses: ./.github/actions/setup-vcpkg

      - name: Configure and Build
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DNEXUSFORCE_BUILD_DOCS=OFF \
            -DNEXUSFORCE_BUILD_TESTS=ON
          make -j$(nproc) NexusForceUnitTests

      - name: Save vcpkg binary cache
        uses: ./.github/actions/save-vcpkg-cache
        with:
          cache-key: ${{ steps.vcpkg.outputs.cache-key }}
          cache-hit: ${{ steps.vcpkg.outputs.cache-hit }}
          binary-cache: ${{ steps.vcpkg.outputs.binary-cache }}
          tool-cache-key: ${{ steps.vcpkg.outputs.tool-cache-key }}
          tool-cache-hit: ${{ steps.vcpkg.outputs.tool-cache-hit }}
          vcpkg-tool-cache-path: ${{ steps.vcpkg.outputs.vcpkg-tool-cache-path }}

      - name: Run Valgrind Memcheck
        run: |
          cd build
          set +e
          valgrind \
            --suppressions=../valgrind.supp \
            --leak-check=full \
            --child-silent-after-fork=yes \
            --show-leak-kinds=definite,indirect,possible \
            --errors-for-leak-kinds=definite,indirect \
            --error-exitcode=99 \
            ./bin/Debug/NexusForceUnitTests 2>&1 | tee valgrind_output.txt
          VALGRIND_EXIT=${PIPESTATUS[0]}
          echo "valgrind exit code: ${VALGRIND_EXIT}"
          if [ "${VALGRIND_EXIT}" -eq 99 ]; then
            echo "::error::Valgrind reported memory errors or leaks"
            exit 1
          fi
          if [ "${VALGRIND_EXIT}" -ne 0 ]; then
            echo "::error::Unit tests failed; valgrind itself reported no memory errors"
            exit "${VALGRIND_EXIT}"
          fi

      - name: Check Leak Summary
        if: always()
        run: |
          cd build
          echo "=== Valgrind Leak Summary ==="
          grep -A 10 "LEAK SUMMARY:" valgrind_output.txt || echo "No leak summary found"
          echo ""
          echo "=== Error Summary ==="
          grep "ERROR SUMMARY:" valgrind_output.txt || echo "No error summary found"

      - name: Upload Valgrind Output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valgrind-output
          path: build/valgrind_output.txt
          retention-days: 7
