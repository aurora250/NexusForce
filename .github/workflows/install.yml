name: "Install Check"

# Verifies the packaged artifacts rather than the build tree: scripts/install_nexusforce.py has to
# produce a prefix that a third-party project can find, link and use, including every public tool
# (NFRS) and every installed CMake helper (nexusforce_compiler_options, nexusforce_sanitizer_options,
# nexusforce_deploy_runtime, nexusforce_reflect_scan).
#
# Both the installed prefix and the consumer live outside the checked-out workspace: a prefix inside
# the source tree, or a consumer built next to it, could reach the development tree and the test
# would no longer prove that NexusForce is usable as an installed package. Only the consumer project
# itself is copied out of the repository, so nothing else from the repository is reachable from it.
#
# NFRS is installed for Release only, so every job installs Release as well as Debug - in one job,
# into one prefix - and then configures the consumer once per configuration. Debug is installed and
# checked first because the Release install is what makes NexusForce::NFRS available to both
# consumers.

on:
  push:
    branches: [ dev ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/install/**'
      - 'tools/**'
      - 'cmake/**'
      - 'scripts/install_nexusforce.py'
      - 'CMakeLists.txt'
      - 'NexusForceConfig.cmake.in'
      - 'vcpkg.json'
      - 'config.json'
      - '.github/workflows/install.yml'
      - '.github/actions/setup-vcpkg/**'
  pull_request:
    branches: [ dev ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/install/**'
      - 'tools/**'
      - 'cmake/**'
      - 'scripts/install_nexusforce.py'
      - 'CMakeLists.txt'
      - 'NexusForceConfig.cmake.in'
      - 'vcpkg.json'
      - 'config.json'
      - '.github/workflows/install.yml'
      - '.github/actions/setup-vcpkg/**'
  workflow_dispatch:

jobs:
  install:
    name: "${{ matrix.os }} · ${{ matrix.compiler }}"
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: clang
          - os: windows-latest
            compiler: msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup vcpkg
        id: vcpkg
        uses: ./.github/actions/setup-vcpkg

      - name: Install toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang libtirpc-dev libc++abi-dev liburing-dev

      - name: Setup MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: pip install ninja

      - name: Stage the third-party workspace
        shell: bash
        run: |
          set -euo pipefail

          if command -v cygpath >/dev/null 2>&1; then
            temp=$(cygpath -m "$RUNNER_TEMP")
            workspace=$(cygpath -m "$GITHUB_WORKSPACE")
          else
            temp="$RUNNER_TEMP"
            workspace="$GITHUB_WORKSPACE"
          fi

          outside="$temp/nexusforce-install-check"
          rm -rf "$outside"
          mkdir -p "$outside"

          case "$outside" in
            "$workspace"/*)
              echo "::error::staging directory $outside is inside the workspace $workspace"
              exit 1
              ;;
          esac

          cp -r tests/install "$outside/consumer"

          {
            echo "NF_PREFIX=$outside/prefix"
            echo "NF_CONSUMER=$outside/consumer"
            echo "NF_OUTSIDE=$outside"
          } >> "$GITHUB_ENV"

          echo "package prefix: $outside/prefix"
          echo "consumer:       $outside/consumer"
          ls "$outside/consumer"

      # The consumer declares its own dependencies; a drift between the two manifests would stay
      # invisible until the consumer failed to resolve a dependency, so compare them first.
      - name: Check the staged consumer manifest matches the library manifest
        shell: bash
        run: |
          set -euo pipefail

          PY=$(command -v python3 || command -v python)

          LIBRARY_MANIFEST="$GITHUB_WORKSPACE/vcpkg.json" CONSUMER_MANIFEST="$NF_CONSUMER/vcpkg.json" \
            "$PY" - <<'PY'
          import json, os, sys

          library = json.load(open(os.environ["LIBRARY_MANIFEST"], encoding="utf-8"))
          consumer = json.load(open(os.environ["CONSUMER_MANIFEST"], encoding="utf-8"))

          for field in ("builtin-baseline", "dependencies", "default-features"):
              if library.get(field) != consumer.get(field):
                  print(f"::error::the consumer manifest differs from vcpkg.json in '{field}'")
                  sys.exit(1)

          print("consumer manifest matches the library manifest")
          PY

      # Release is installed after Debug so that one prefix carries both the Debug library and the
      # Release-only NFRS tool.
      #
      # A multi-configuration generator is required. Every install rewrites the exported target file
      # and deletes the per-configuration files of the configurations it does not install, so two
      # single-configuration installs into one prefix leave only the last configuration declared in
      # the export: a Debug consumer would then silently link the Release library. One
      # multi-configuration configure installs both and keeps both listed.
      - name: Install NexusForce with scripts/install_nexusforce.py
        shell: bash
        run: |
          set -euo pipefail

          PY=$(command -v python3 || command -v python)

          generator=(-G "Ninja Multi-Config")
          if [ "$RUNNER_OS" != "Windows" ]; then
            export CC=clang
            export CXX=clang++
          fi

          for config in Debug Release; do
            "$PY" scripts/install_nexusforce.py \
              "${generator[@]}" \
              --build-dir "$NF_OUTSIDE/build" \
              --config "$config" \
              --prefix "$NF_PREFIX" \
              --parallel 4
          done

      - name: Check the exported package declares both configurations
        shell: bash
        run: |
          set -euo pipefail

          export_file="$NF_PREFIX/lib/cmake/NexusForce/NexusForceTargets.cmake"

          for config in DEBUG RELEASE; do
            if ! grep -q "IMPORTED_CONFIGURATIONS ${config}" \
              "$NF_PREFIX"/lib/cmake/NexusForce/NexusForceTargets-*.cmake; then
              echo "::error::the exported package does not declare ${config}; a consumer of that" \
                   "configuration would fall back to another configuration's library"
              exit 1
            fi
            echo "$export_file declares ${config}"
          done

      - name: Check the installed layout
        shell: bash
        run: |
          set -euo pipefail

          status=0

          require() {
            if [ -e "$1" ]; then
              echo "found $1"
            else
              echo "::error::missing installed artifact: $1"
              status=1
            fi
          }

          require "$NF_PREFIX/include/NeForce/core/reflect/registry.hpp"
          require "$NF_PREFIX/lib/cmake/NexusForce/NexusForceConfig.cmake"
          require "$NF_PREFIX/lib/cmake/NexusForce/NexusForceTargets.cmake"
          require "$NF_PREFIX/lib/cmake/NexusForce/NexusForceTargets-debug.cmake"
          require "$NF_PREFIX/lib/cmake/NexusForce/NexusForceTargets-release.cmake"
          require "$NF_PREFIX/lib/cmake/NexusForce/NexusForceCompilerOptions.cmake"
          require "$NF_PREFIX/lib/cmake/NexusForce/NexusForceSanitizer.cmake"
          require "$NF_PREFIX/lib/cmake/NexusForce/NexusForceReflectScanner.cmake"
          require "$NF_PREFIX/lib/cmake/NexusForce/NexusForceRuntime.cmake"

          if ! grep -q 'NEFORCE_USING_MEMORY_POOL' "$NF_PREFIX/lib/cmake/NexusForce/NexusForceTargets.cmake"; then
            echo "::error::the exported targets do not forward NEFORCE_USING_MEMORY_POOL to consumers"
            status=1
          fi

          for variable in NEXUSFORCE_USING_MEMORY_POOL NEXUSFORCE_MEMORY_POOL_GLOBAL_OVERRIDE; do
            if ! grep -q "$variable" "$NF_PREFIX/lib/cmake/NexusForce/NexusForceConfig.cmake"; then
              echo "::error::the installed package config does not report $variable"
              status=1
            fi
          done

          if [ "$RUNNER_OS" != "Windows" ]; then
            for library in "$NF_PREFIX/lib/libNexusForce.so" "$NF_PREFIX/lib/libNexusForced.so"; do
              if nm -D --defined-only "$library" | grep -E ' (_Znwm|_Znam|_ZdlPv|_ZdaPv)(St11align_val_t)?$'; then
                echo "::error::$library defines a global allocation operator"
                status=1
              fi
              if ! nm -D --defined-only "$library" | grep -q '_ZN7neforce18system_memory_poolEv'; then
                echo "::error::$library does not export the pool singleton"
                status=1
              fi
            done
          fi

          if [ "$RUNNER_OS" = "Windows" ]; then
            require "$NF_PREFIX/bin/NFRS.exe"
            require "$NF_PREFIX/bin/NexusForce.dll"
            require "$NF_PREFIX/bin/NexusForced.dll"

            if ! command -v dumpbin >/dev/null 2>&1; then
              echo "::error::dumpbin is unavailable; the installed runtime layout cannot be verified"
              exit 1
            fi

            for library in "$NF_PREFIX/bin/NexusForce.dll" "$NF_PREFIX/bin/NexusForced.dll"; do
              while read -r import; do
                [ -n "$import" ] || continue
                case "$import" in
                  api-ms-*|ext-ms-*|vcruntime140*|msvcp140*|concrt140*|ucrtbase.dll) continue ;;
                esac
                if [ -f "/c/Windows/System32/$import" ]; then
                  continue
                fi
                require "$NF_PREFIX/bin/$import"
              done < <(dumpbin -dependents "$library" | tr -d '\r' | sed -n 's/^ *\([A-Za-z0-9._-]*\.dll\)$/\1/p')
            done

            for library in "$NF_PREFIX/bin/NexusForce.dll" "$NF_PREFIX/bin/NexusForced.dll"; do
              if dumpbin -exports "$library" | grep -E '\?\?(_[UV])?[23]@YA'; then
                echo "::error::$library exports a global allocation operator"
                status=1
              fi

              if ! dumpbin -exports "$library" | grep -q 'system_memory_pool@neforce@@'; then
                echo "::error::$library does not export the pool singleton"
                status=1
              fi
            done
          else
            require "$NF_PREFIX/bin/NFRS"
            require "$NF_PREFIX/lib/libNexusForce.so"
            require "$NF_PREFIX/lib/libNexusForced.so"
          fi

          exit $status

      - name: Run the installed NFRS
        shell: bash
        run: |
          set -euo pipefail

          if [ "$RUNNER_OS" = "Windows" ]; then
            nfrs="$NF_PREFIX/bin/NFRS.exe"
          else
            nfrs="$NF_PREFIX/bin/NFRS"
          fi

          output="$NF_OUTSIDE/nfrs-standalone.cpp"
          "$nfrs" "$NF_CONSUMER" -o "$output"

          if [ ! -s "$output" ]; then
            echo "::error::NFRS produced no output"
            exit 1
          fi

          for symbol in InstallConsumerColor InstallConsumerOrder InstallConsumerWorker InstallConsumerEmitter; do
            if ! grep -q "$symbol" "$output"; then
              echo "::error::NFRS output does not mention $symbol"
              exit 1
            fi
          done

          echo "NFRS generated $(wc -l < "$output") lines for the consumer's reflected types"

      - name: Build and run the consumer (Debug then Release)
        shell: bash
        run: |
          set -euo pipefail

          for config in Debug Release; do
            lower=$(echo "$config" | tr 'A-Z' 'a-z')
            build_dir="$NF_OUTSIDE/consumer-$lower"

            if [ "$RUNNER_OS" = "Windows" ]; then
              generator=(-G "Ninja Multi-Config")
              configure_args=()
              build_args=(--config "$config")
              exe="$build_dir/bin/$config/install_consumer.exe"
            else
              generator=(-G Ninja)
              configure_args=(-DCMAKE_BUILD_TYPE="$config" -DCMAKE_CXX_COMPILER=clang++)
              build_args=()
              exe="$build_dir/bin/$config/install_consumer"
            fi

            cmake -S "$NF_CONSUMER" -B "$build_dir" \
              "${generator[@]}" \
              "${configure_args[@]}" \
              -DCMAKE_PREFIX_PATH="$NF_PREFIX" \
              -DNEXUSFORCE_EXPECTED_PREFIX="$NF_PREFIX" \
              -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

            cmake --build "$build_dir" "${build_args[@]}" --parallel 4

            generated="$build_dir/_nfrs_gen_install_consumer.cpp"
            if [ ! -s "$generated" ]; then
              echo "::error::nexusforce_reflect_scan() generated nothing for the $config consumer"
              exit 1
            fi

            echo "running $exe"
            "$exe"
          done

      # nexusforce_sanitizer_options() is a no-op unless the consumer enables sanitizers, and the
      # installed module rejects compilers that cannot take -fsanitize, so its active path is only
      # reachable on the Linux leg. The consumer is compiled but not run: the installed library is
      # not instrumented, and leaking library state is sanitizer.yml's subject, not this workflow's.
      - name: Check the installed sanitizer helper applies its flags
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          build_dir="$NF_OUTSIDE/consumer-sanitized"

          cmake -S "$NF_CONSUMER" -B "$build_dir" -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DNEXUSFORCE_ENABLE_ASAN=ON \
            -DNEXUSFORCE_ENABLE_UBSAN=ON \
            -DCMAKE_PREFIX_PATH="$NF_PREFIX" \
            -DNEXUSFORCE_EXPECTED_PREFIX="$NF_PREFIX" \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

          cmake --build "$build_dir" --parallel 4

          for flag in "-fsanitize=address" "-fsanitize=undefined"; do
            if ! grep -q -- "$flag" "$build_dir/compile_commands.json"; then
              echo "::error::nexusforce_sanitizer_options() did not apply $flag"
              exit 1
            fi
            echo "consumer compiled with $flag"
          done

      - name: Check each consumer resolved its own configuration
        shell: bash
        run: |
          set -euo pipefail

          if [ "$RUNNER_OS" = "Windows" ]; then
            debug_dll="$NF_OUTSIDE/consumer-debug/bin/Debug/NexusForced.dll"
            release_dll="$NF_OUTSIDE/consumer-release/bin/Release/NexusForce.dll"

            for dll in "$debug_dll" "$release_dll"; do
              if [ ! -f "$dll" ]; then
                echo "::error::nexusforce_deploy_runtime() did not deploy $dll"
                exit 1
              fi
            done

            for runtime_dir in "$NF_OUTSIDE/consumer-debug/bin/Debug" "$NF_OUTSIDE/consumer-release/bin/Release"; do
              deployed=$(ls "$runtime_dir"/*.dll 2>/dev/null | wc -l || true)
              if [ "$deployed" -le 2 ]; then
                echo "::error::nexusforce_deploy_runtime() deployed $deployed DLL(s) into $runtime_dir, no more than the NexusForce pair"
                exit 1
              fi
              echo "deployed $deployed DLLs into $runtime_dir"
            done

            debug_installed=$(wc -c < "$NF_PREFIX/bin/NexusForced.dll")
            release_installed=$(wc -c < "$NF_PREFIX/bin/NexusForce.dll")
            debug_deployed=$(wc -c < "$debug_dll")
            release_deployed=$(wc -c < "$release_dll")

            if [ "$debug_deployed" -ne "$debug_installed" ] || [ "$release_deployed" -ne "$release_installed" ]; then
              echo "::error::a consumer deployed a NexusForce DLL that is not the one installed for its configuration"
              exit 1
            fi

            echo "deployed NexusForce DLLs: Debug ${debug_deployed} bytes, Release ${release_deployed} bytes"
          else
            for pair in "consumer-debug/bin/Debug/install_consumer Debug libNexusForced.so" \
                        "consumer-release/bin/Release/install_consumer Release libNexusForce.so"; do
              set -- $pair
              resolved=$(ldd "$NF_OUTSIDE/$1" | grep "$3" | head -1)

              case "$resolved" in
                *"$NF_PREFIX/lib/$3"*)
                  echo "$1 -> $resolved"
                  ;;
                *)
                  echo "::error::$1 did not resolve $3 from the prefix: $resolved"
                  exit 1
                  ;;
              esac
            done
          fi

      - name: Save vcpkg caches
        uses: ./.github/actions/save-vcpkg-cache
        with:
          cache-key: ${{ steps.vcpkg.outputs.cache-key }}
          cache-hit: ${{ steps.vcpkg.outputs.cache-hit }}
          binary-cache: ${{ steps.vcpkg.outputs.binary-cache }}
          tool-cache-key: ${{ steps.vcpkg.outputs.tool-cache-key }}
          tool-cache-hit: ${{ steps.vcpkg.outputs.tool-cache-hit }}
          vcpkg-tool-cache-path: ${{ steps.vcpkg.outputs.vcpkg-tool-cache-path }}

      - name: Upload install logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: install-logs-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            ${{ env.NF_OUTSIDE }}/build/CMakeFiles/CMakeConfigureLog.yaml
            ${{ env.NF_OUTSIDE }}/consumer-debug/CMakeFiles/CMakeConfigureLog.yaml
            ${{ env.NF_OUTSIDE }}/consumer-release/CMakeFiles/CMakeConfigureLog.yaml
            ${{ env.NF_OUTSIDE }}/consumer-sanitized/CMakeFiles/CMakeConfigureLog.yaml
          retention-days: 7
          if-no-files-found: ignore
