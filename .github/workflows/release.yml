name: "Release"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
        default: '1.0.0'
      prerelease:
        description: 'Is this a prerelease?'
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
            PRERELEASE="${{ github.event.inputs.prerelease }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
            PRERELEASE="false"
            if [[ "$VERSION" == *-* ]]; then
              PRERELEASE="true"
            fi
          fi

          if ! [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::Invalid version format: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION (prerelease: $PRERELEASE)"

      - name: Extract changelog section
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          awk -v ver="$VERSION" '
            BEGIN { found = 0; pattern = "## [" ver "]" }
            index($0, pattern) == 1 { found = 1 }
            found && /^## \[/ && index($0, pattern) != 1 { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release_body.md

          if [ ! -s /tmp/release_body.md ]; then
            echo "::error::No changelog section found for version $VERSION"
            exit 1
          fi

          echo "=== Release body ==="
          cat /tmp/release_body.md
          echo "===================="

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: Release v${{ steps.meta.outputs.version }}
          body_path: /tmp/release_body.md
          draft: false
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
