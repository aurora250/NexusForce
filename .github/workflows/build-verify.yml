name: "Build Verify"

on:
  push:
    branches: [ dev ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'examples/**'
      - 'tools/**'
      - 'benchmark/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'vcpkg.json'
      - 'config.json'
      - '.github/workflows/build-verify.yml'
  pull_request:
    branches: [ dev ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'examples/**'
      - 'tools/**'
      - 'benchmark/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'vcpkg.json'
      - 'config.json'
      - '.github/workflows/build-verify.yml'
  workflow_dispatch:

jobs:
  build:
    name: "${{ matrix.os }} · ${{ matrix.compiler }} · ${{ matrix.config }} · C++${{ matrix.cppstd }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            compiler: msvc
            config: full
            cppstd: 20
          - os: windows-latest
            compiler: msvc
            config: minimal
            cppstd: 14
          - os: windows-latest
            compiler: msvc
            config: sqlcipher
            cppstd: 20

          - os: windows-latest
            compiler: msvc
            config: cross-arm64-msvc
            cppstd: 20

          - os: windows-2022
            compiler: clang-cl
            config: full
            cppstd: 20
          - os: windows-2022
            compiler: clang-cl
            config: minimal
            cppstd: 17

          - os: ubuntu-latest
            compiler: gcc
            config: full
            cppstd: 20
          - os: ubuntu-latest
            compiler: gcc
            config: minimal
            cppstd: 14
          - os: ubuntu-latest
            compiler: gcc
            config: all-db
            cppstd: 20

          - os: ubuntu-latest
            compiler: clang
            config: full
            cppstd: 20
          - os: ubuntu-latest
            compiler: clang
            config: minimal
            cppstd: 17
          - os: ubuntu-latest
            compiler: clang
            config: no-compress
            cppstd: 20

          - os: ubuntu-latest
            compiler: clang
            config: pool-off
            cppstd: 20
          - os: ubuntu-latest
            compiler: clang
            config: pool-tls-global-dynamic
            cppstd: 20

          - os: ubuntu-latest
            compiler: gcc
            config: cross-riscv64
            cppstd: 20

          - os: ubuntu-latest
            compiler: gcc
            config: cross-loongarch64
            cppstd: 20

          - os: ubuntu-latest
            compiler: gcc
            config: cross-arm64
            cppstd: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential      \
            cmake                \
            ninja-build          \
            pkg-config           \
            libtirpc-dev         \
            liburing-dev         \
            curl                 \
            zip                  \
            unzip                \
            tar

      - name: Install Clang (Ubuntu)
        if: runner.os == 'Linux' && matrix.compiler == 'clang'
        run: |
          UBUNTU_VERSION=$(lsb_release -cs)
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo add-apt-repository -y "deb http://apt.llvm.org/${UBUNTU_VERSION}/ llvm-toolchain-${UBUNTU_VERSION}-19 main"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-19 clang++-19
          sudo update-alternatives --install /usr/bin/clang   clang   /usr/bin/clang-19   100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-19 100
          clang++ --version

      - name: Install cross-compilation toolchains (Ubuntu)
        if: runner.os == 'Linux' && startsWith(matrix.config, 'cross-')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            g++-aarch64-linux-gnu        \
            g++-riscv64-linux-gnu        \
            g++-14-loongarch64-linux-gnu \
            qemu-user-static

      - name: Setup LoongArch compiler symlinks
        if: matrix.config == 'cross-loongarch64'
        run: |
          for tool in gcc g++ gfortran; do
            sudo ln -sf loongarch64-linux-gnu-${tool}-14 /usr/bin/loongarch64-linux-gnu-${tool}
          done
          sudo rm -f /usr/bin/loongarch64-linux-gnu-ld
          sudo ln -sf loongarch64-linux-gnu-ld.bfd /usr/bin/loongarch64-linux-gnu-ld

      - name: Setup vcpkg
        id: vcpkg
        uses: ./.github/actions/setup-vcpkg

      - name: Setup vcpkg cross-compilation patches
        if: runner.os == 'Linux' && startsWith(matrix.config, 'cross-')
        shell: bash
        run: |
          TC="$VCPKG_ROOT/scripts/toolchains/linux.cmake"
          if ! grep -q 'loongarch64' "$TC"; then
            sudo sed -i '/STREQUAL "riscv64"/a\    elseif(VCPKG_TARGET_ARCHITECTURE STREQUAL "loongarch64")\n      set(CMAKE_SYSTEM_PROCESSOR loongarch64 CACHE STRING "")' "$TC"
          fi
          for triplet in riscv64 loongarch64; do
            TRIPLET_FILE="$VCPKG_ROOT/triplets/community/${triplet}-linux.cmake"
            if [ ! -f "$TRIPLET_FILE" ]; then
              printf 'set(VCPKG_TARGET_ARCHITECTURE %s)\nset(VCPKG_CRT_LINKAGE dynamic)\nset(VCPKG_LIBRARY_LINKAGE static)\nset(VCPKG_CMAKE_SYSTEM_NAME Linux)\n' "$triplet" | sudo tee "$TRIPLET_FILE" > /dev/null
            fi
          done

      - name: Setup MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.config == 'cross-arm64-msvc' && 'amd64_arm64' || 'amd64' }}

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: pip install ninja

      - name: CMake configure
        shell: bash
        run: |
          FLAGS=(
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
            -DNEXUSFORCE_BUILD_DOCS=OFF
            -DCMAKE_CXX_STANDARD=${{ matrix.cppstd }}
          )

          case "${{ matrix.config }}" in
            full) ;;
            minimal)
              FLAGS+=(
                -DNEXUSFORCE_ENABLE_POSTGRESQL=OFF
                -DNEXUSFORCE_ENABLE_MYSQL=OFF
                -DNEXUSFORCE_ENABLE_SQLITE3=OFF
                -DNEXUSFORCE_ENABLE_REDIS=OFF
                -DNEXUSFORCE_ENABLE_ZLIB=OFF
                -DNEXUSFORCE_ENABLE_LZ4=OFF
                -DNEXUSFORCE_USING_SSO=OFF
                -DNEXUSFORCE_USING_INTEL_TSX=OFF
                -DNEXUSFORCE_USING_SQLCIPHER=OFF
                -DNEXUSFORCE_BUILD_TESTS=OFF
                -DNEXUSFORCE_BUILD_EXAMPLES=OFF
                -DNEXUSFORCE_BUILD_BENCHMARKS=OFF
              )
              ;;
            sqlcipher)
              FLAGS+=(
                -DNEXUSFORCE_USING_SQLCIPHER=ON
                -DNEXUSFORCE_BUILD_TESTS=OFF
                -DNEXUSFORCE_BUILD_EXAMPLES=OFF
                -DNEXUSFORCE_BUILD_BENCHMARKS=OFF
              )
              ;;
            all-db)
              FLAGS+=(
                -DNEXUSFORCE_ENABLE_POSTGRESQL=ON
                -DNEXUSFORCE_ENABLE_MYSQL=ON
                -DNEXUSFORCE_ENABLE_SQLITE3=ON
                -DNEXUSFORCE_ENABLE_REDIS=ON
                -DNEXUSFORCE_BUILD_EXAMPLES=OFF
                -DNEXUSFORCE_BUILD_BENCHMARKS=OFF
              )
              ;;
            no-compress)
              FLAGS+=(
                -DNEXUSFORCE_ENABLE_ZLIB=OFF
                -DNEXUSFORCE_ENABLE_LZ4=OFF
                -DNEXUSFORCE_BUILD_EXAMPLES=OFF
                -DNEXUSFORCE_BUILD_BENCHMARKS=OFF
              )
              ;;
            pool-off)
              FLAGS+=(
                -DNEXUSFORCE_USING_MEMORY_POOL=OFF
                -DNEXUSFORCE_BUILD_EXAMPLES=OFF
                -DNEXUSFORCE_BUILD_BENCHMARKS=OFF
              )
              ;;
            pool-tls-global-dynamic)
              FLAGS+=(
                -DCMAKE_CXX_FLAGS=-DNEFORCE_MEMORY_POOL_TLS_GLOBAL_DYNAMIC
                -DNEXUSFORCE_BUILD_EXAMPLES=OFF
                -DNEXUSFORCE_BUILD_BENCHMARKS=OFF
              )
              ;;
            cross-riscv64)
              FLAGS+=(
                -DVCPKG_TARGET_TRIPLET=riscv64-linux
                -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=${GITHUB_WORKSPACE}/cmake/toolchains/riscv64-linux-gnu.cmake
                -DNEXUSFORCE_ENABLE_POSTGRESQL=OFF
                -DNEXUSFORCE_ENABLE_MYSQL=OFF
                -DNEXUSFORCE_ENABLE_SQLITE3=OFF
                -DNEXUSFORCE_ENABLE_REDIS=OFF
                -DNEXUSFORCE_ENABLE_ZLIB=OFF
                -DNEXUSFORCE_ENABLE_LZ4=OFF
                -DNEXUSFORCE_BUILD_TESTS=OFF
                -DNEXUSFORCE_BUILD_EXAMPLES=OFF
                -DNEXUSFORCE_BUILD_BENCHMARKS=OFF
              )
              ;;
            cross-loongarch64)
              FLAGS+=(
                -DVCPKG_TARGET_TRIPLET=loongarch64-linux
                -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=${GITHUB_WORKSPACE}/cmake/toolchains/loongarch64-linux-gnu.cmake
                -DNEXUSFORCE_ENABLE_POSTGRESQL=OFF
                -DNEXUSFORCE_ENABLE_MYSQL=OFF
                -DNEXUSFORCE_ENABLE_SQLITE3=OFF
                -DNEXUSFORCE_ENABLE_REDIS=OFF
                -DNEXUSFORCE_ENABLE_ZLIB=OFF
                -DNEXUSFORCE_ENABLE_LZ4=OFF
                -DNEXUSFORCE_BUILD_TESTS=OFF
                -DNEXUSFORCE_BUILD_EXAMPLES=OFF
                -DNEXUSFORCE_BUILD_BENCHMARKS=OFF
              )
              ;;
            cross-arm64)
              FLAGS+=(
                -DVCPKG_TARGET_TRIPLET=arm64-linux
                -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=${GITHUB_WORKSPACE}/cmake/toolchains/aarch64-linux-gnu.cmake
                -DNEXUSFORCE_BUILD_TESTS=OFF
                -DNEXUSFORCE_BUILD_EXAMPLES=OFF
                -DNEXUSFORCE_BUILD_BENCHMARKS=OFF
              )
              ;;
            cross-arm64-msvc)
              FLAGS+=(
                -DVCPKG_TARGET_TRIPLET=arm64-windows
                -DVCPKG_INSTALL_OPTIONS=--allow-unsupported
                -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=${GITHUB_WORKSPACE}/cmake/toolchains/arm64-windows-msvc.cmake
                -DNEXUSFORCE_BUILD_TESTS=OFF
                -DNEXUSFORCE_BUILD_EXAMPLES=OFF
                -DNEXUSFORCE_BUILD_BENCHMARKS=OFF
              )
              ;;
          esac

          if [ "${{ runner.os }}" = "Windows" ]; then
            if [ "${{ matrix.compiler }}" = "clang-cl" ]; then
              cmake -B build -G Ninja \
                -DCMAKE_C_COMPILER=clang-cl \
                -DCMAKE_CXX_COMPILER=clang-cl \
                -DCMAKE_BUILD_TYPE=Release \
                "${FLAGS[@]}"
            else
              cmake -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                "${FLAGS[@]}"
            fi
          else
            if [[ "${{ matrix.config }}" == cross-* ]]; then
              cmake -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                "${FLAGS[@]}"
            elif [ "${{ matrix.compiler }}" = "clang" ]; then
              cmake -B build -G Ninja \
                -DCMAKE_C_COMPILER=clang \
                -DCMAKE_CXX_COMPILER=clang++ \
                -DCMAKE_BUILD_TYPE=Release \
                "${FLAGS[@]}"
            else
              cmake -B build -G Ninja \
                -DCMAKE_C_COMPILER=gcc \
                -DCMAKE_CXX_COMPILER=g++ \
                -DCMAKE_BUILD_TYPE=Release \
                "${FLAGS[@]}"
            fi
          fi

      - name: Build
        shell: bash
        run: |
          BUILD_LOG=$(mktemp)
          set +e
          cmake --build build --config Release --parallel 2>&1 | tee "$BUILD_LOG"
          BUILD_EXIT=${PIPESTATUS[0]}

          if grep -q "Relocations in generic ELF" "$BUILD_LOG" 2>/dev/null; then
            if [[ "${{ matrix.config }}" == cross-* ]]; then
              echo "::warning::vcpkg cross-compiled packages contain host-arch objects (Relocations in generic ELF). This is a vcpkg cross-build limitation, not a project defect. Treated as success."
              exit 0
            fi
          fi

          exit $BUILD_EXIT

      - name: Save vcpkg binary cache
        uses: ./.github/actions/save-vcpkg-cache
        with:
          cache-key: ${{ steps.vcpkg.outputs.cache-key }}
          cache-hit: ${{ steps.vcpkg.outputs.cache-hit }}
          binary-cache: ${{ steps.vcpkg.outputs.binary-cache }}
          tool-cache-key: ${{ steps.vcpkg.outputs.tool-cache-key }}
          tool-cache-hit: ${{ steps.vcpkg.outputs.tool-cache-hit }}
          vcpkg-tool-cache-path: ${{ steps.vcpkg.outputs.vcpkg-tool-cache-path }}

      - name: Summary
        if: always()
        run: |
          echo "| 项目 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|----|" >> $GITHUB_STEP_SUMMARY
          echo "| 平台 | ${{ runner.os }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 编译器 | ${{ matrix.compiler }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 配置 | ${{ matrix.config }} |" >> $GITHUB_STEP_SUMMARY
          echo "| C++ 标准 | ${{ matrix.cppstd }} |" >> $GITHUB_STEP_SUMMARY
        shell: bash

  allocator:
    name: "allocator · global new/delete override (gcc · Release)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies (Ubuntu)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential      \
            cmake                \
            ninja-build          \
            pkg-config           \
            libtirpc-dev         \
            liburing-dev         \
            curl                 \
            zip                  \
            unzip                \
            tar

      - name: Setup vcpkg
        id: vcpkg
        uses: ./.github/actions/setup-vcpkg

      - name: CMake configure
        shell: bash
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DNEXUSFORCE_BUILD_DOCS=OFF \
            -DNEXUSFORCE_BUILD_EXAMPLES=OFF \
            -DNEXUSFORCE_BUILD_BENCHMARKS=OFF

      - name: Build library and allocator test targets
        shell: bash
        run: |
          cmake --build build --parallel --target \
            NexusForce NexusForceUnitTests NexusForceAllocatorOverrideTest

      - name: Run memory pool unit tests
        shell: bash
        run: |
          ./build/bin/Release/NexusForceUnitTests --gtest_filter='MemoryPool*:PoolAllocator*'

      - name: Run global override integration test
        shell: bash
        run: |
          ./build/bin/Release/NexusForceAllocatorOverrideTest

      - name: Save vcpkg binary cache
        uses: ./.github/actions/save-vcpkg-cache
        with:
          cache-key: ${{ steps.vcpkg.outputs.cache-key }}
          cache-hit: ${{ steps.vcpkg.outputs.cache-hit }}
          binary-cache: ${{ steps.vcpkg.outputs.binary-cache }}
          tool-cache-key: ${{ steps.vcpkg.outputs.tool-cache-key }}
          tool-cache-hit: ${{ steps.vcpkg.outputs.tool-cache-hit }}
          vcpkg-tool-cache-path: ${{ steps.vcpkg.outputs.vcpkg-tool-cache-path }}

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "| 项目 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|----|" >> $GITHUB_STEP_SUMMARY
          echo "| 平台 | ubuntu-latest |" >> $GITHUB_STEP_SUMMARY
          echo "| 编译器 | gcc |" >> $GITHUB_STEP_SUMMARY
          echo "| 配置 | 默认（NEXUSFORCE_USING_MEMORY_POOL=ON，链接 NexusForceMemoryPoolOverride） |" >> $GITHUB_STEP_SUMMARY
          echo "| 覆盖生效验证 | new/delete 计入 system_memory_pool() 统计 |" >> $GITHUB_STEP_SUMMARY
