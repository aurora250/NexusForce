name: "Build Verify"

on:
  push:
    branches: [ dev ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'examples/**'
      - 'tools/**'
      - 'benchmark/**'
      - 'cmake/**'
      - 'scripts/**'
      - 'CMakeLists.txt'
      - 'vcpkg.json'
      - 'config.json'
      - '.github/workflows/build-verify.yml'
      - '.github/actions/setup-vcpkg/**'
      - '.github/actions/save-vcpkg-cache/**'
  pull_request:
    branches: [ dev ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'examples/**'
      - 'tools/**'
      - 'benchmark/**'
      - 'cmake/**'
      - 'scripts/**'
      - 'CMakeLists.txt'
      - 'vcpkg.json'
      - 'config.json'
      - '.github/workflows/build-verify.yml'
      - '.github/actions/setup-vcpkg/**'
      - '.github/actions/save-vcpkg-cache/**'
  workflow_dispatch:

jobs:
  build:
    name: "${{ matrix.os }} · ${{ matrix.compiler }} · ${{ matrix.config }} · C++${{ matrix.cppstd }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows: x64 MSVC/ClangCL builds and the native Windows 11 ARM64 runner.
          - os: windows-latest
            compiler: msvc
            config: full
            triplet: x64-windows
            cppstd: 20
          - os: windows-latest
            compiler: msvc
            config: minimal
            triplet: x64-windows
            cppstd: 14
          - os: windows-latest
            compiler: msvc
            config: sqlcipher
            triplet: x64-windows
            cppstd: 20

          - os: windows-11-arm
            compiler: msvc
            config: full
            triplet: arm64-windows
            vcpkg_install_options: --allow-unsupported
            cppstd: 20

          - os: windows-11-arm
            compiler: clang-cl
            config: full
            triplet: arm64-windows
            clang_target: aarch64-pc-windows-msvc
            vcpkg_install_options: --allow-unsupported
            cppstd: 20

          - os: windows-2022
            compiler: clang-cl
            config: full
            triplet: x64-windows
            cppstd: 20
          - os: windows-2022
            compiler: clang-cl
            config: minimal
            triplet: x64-windows
            cppstd: 17

          # Ubuntu native: GCC and Clang, feature matrix.
          - os: ubuntu-24.04
            compiler: gcc
            config: full
            triplet: x64-linux
            cppstd: 20
          - os: ubuntu-24.04
            compiler: gcc
            config: minimal
            triplet: x64-linux
            cppstd: 14
          - os: ubuntu-24.04
            compiler: gcc
            config: all-db
            triplet: x64-linux
            cppstd: 20

          - os: ubuntu-24.04
            compiler: clang
            config: full
            triplet: x64-linux
            cppstd: 20
          - os: ubuntu-24.04
            compiler: clang
            config: minimal
            triplet: x64-linux
            cppstd: 17
          - os: ubuntu-24.04
            compiler: clang
            config: no-compress
            triplet: x64-linux
            cppstd: 20

          - os: ubuntu-24.04
            compiler: clang
            config: no-icu
            triplet: x64-linux
            cppstd: 20

          - os: ubuntu-24.04
            compiler: clang
            config: no-locale
            triplet: x64-linux
            cppstd: 20

          - os: ubuntu-24.04
            compiler: clang
            config: pool-off
            triplet: x64-linux
            cppstd: 20
          - os: ubuntu-24.04
            compiler: clang
            config: pool-tls-global-dynamic
            triplet: x64-linux
            cppstd: 20

          # Linux cross builds: GCC and Clang toolchains for the three non-x64 targets.
          - os: ubuntu-24.04
            compiler: gcc
            config: cross-riscv64
            triplet: riscv64-linux
            toolchain: riscv64-linux-gnu.cmake
            cross_deps: minimal
            cppstd: 20

          - os: ubuntu-24.04
            compiler: gcc
            config: cross-loongarch64
            triplet: loongarch64-linux
            toolchain: loongarch64-linux-gnu.cmake
            cross_deps: minimal
            cppstd: 20

          - os: ubuntu-24.04
            compiler: gcc
            config: cross-arm64
            triplet: arm64-linux
            toolchain: aarch64-linux-gnu.cmake
            cross_deps: full
            cppstd: 20

          - os: ubuntu-24.04
            compiler: clang
            config: cross-arm64-clang
            triplet: arm64-linux
            toolchain: aarch64-linux-clang.cmake
            cross_deps: full
            cppstd: 20

          - os: ubuntu-24.04
            compiler: clang
            config: cross-riscv64-clang
            triplet: riscv64-linux
            toolchain: riscv64-linux-clang.cmake
            cross_deps: minimal
            cppstd: 20

          - os: ubuntu-24.04
            compiler: clang
            config: cross-loongarch64-clang
            triplet: loongarch64-linux
            toolchain: loongarch64-linux-clang.cmake
            cross_deps: minimal
            cppstd: 20

          # Native macOS runners (arm64 and Intel).
          - os: macos-14
            compiler: clang
            config: macos-arm64
            triplet: arm64-osx
            cppstd: 20

          - os: macos-15-intel
            compiler: clang
            config: macos-x64
            triplet: x64-osx
            cppstd: 20

    steps:
      # Toolchain, compiler environment and third-party dependencies.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential      \
            cmake                \
            ninja-build          \
            pkg-config           \
            libtirpc-dev         \
            liburing-dev         \
            curl                 \
            zip                  \
            unzip                \
            tar

      - name: Install Clang (Ubuntu)
        if: runner.os == 'Linux' && matrix.compiler == 'clang'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-19 clang++-19
          sudo update-alternatives --install /usr/bin/clang   clang   /usr/bin/clang-19   100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-19 100
          clang++ --version

      - name: Install cross-compilation toolchains (Ubuntu)
        if: runner.os == 'Linux' && startsWith(matrix.config, 'cross-')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            g++-aarch64-linux-gnu        \
            g++-riscv64-linux-gnu        \
            g++-14-loongarch64-linux-gnu \
            lld \
            qemu-user-static

      - name: Setup LoongArch compiler symlinks
        if: startsWith(matrix.config, 'cross-loongarch64')
        run: |
          # Ubuntu ships different cross-GCC major versions across releases. Pick whichever
          # versioned driver is actually installed instead of hardcoding -14, which leaves broken
          # symlinks when only -13 is present.
          for tool in gcc g++ gfortran; do
            target=""
            for version in 14 13 12; do
              candidate="/usr/bin/loongarch64-linux-gnu-${tool}-${version}"
              if [ -x "$candidate" ]; then
                target="loongarch64-linux-gnu-${tool}-${version}"
                break
              fi
            done
            if [ -n "$target" ]; then
              sudo ln -sf "$target" "/usr/bin/loongarch64-linux-gnu-${tool}"
            fi
          done
          sudo rm -f /usr/bin/loongarch64-linux-gnu-ld
          sudo ln -sf loongarch64-linux-gnu-ld.bfd /usr/bin/loongarch64-linux-gnu-ld

      - name: Setup MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.os == 'windows-11-arm' && 'arm64' || 'amd64' }}

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # vcpkg ports built with configure (e.g. libpq) need autoconf from the host.
          brew install ninja autoconf automake libtool pkg-config

      # vcpkg must run after the compiler environment and be the last writer of VCPKG_ROOT.
      - name: Setup vcpkg
        id: vcpkg
        uses: ./.github/actions/setup-vcpkg
        with:
          triplet: ${{ matrix.triplet }}
          image: ${{ matrix.os }}${{ startsWith(matrix.config, 'cross-') && matrix.compiler == 'clang' && '-clang' || '' }}

      - name: Setup vcpkg cross-compilation patches
        if: runner.os == 'Linux' && startsWith(matrix.config, 'cross-')
        shell: bash
        run: |
          TC="$VCPKG_ROOT/scripts/toolchains/linux.cmake"
          if ! grep -q 'loongarch64' "$TC"; then
            sudo sed -i '/STREQUAL "riscv64"/a\    elseif(VCPKG_TARGET_ARCHITECTURE STREQUAL "loongarch64")\n      set(CMAKE_SYSTEM_PROCESSOR loongarch64 CACHE STRING "")' "$TC"
          fi
          for triplet in riscv64 loongarch64; do
            TRIPLET_FILE="$VCPKG_ROOT/triplets/community/${triplet}-linux.cmake"
            if [ ! -f "$TRIPLET_FILE" ]; then
              # libmysql auto-selects lld when available; lld rejects GCC's exception
              # tables on LoongArch, so keep that port on GNU ld.
              {
                printf 'set(VCPKG_TARGET_ARCHITECTURE %s)\n' "$triplet"
                printf 'set(VCPKG_CRT_LINKAGE dynamic)\n'
                printf 'set(VCPKG_LIBRARY_LINKAGE static)\n'
                printf 'set(VCPKG_CMAKE_SYSTEM_NAME Linux)\n'
                printf 'set(VCPKG_CMAKE_CONFIGURE_OPTIONS "-DUSE_LD_LLD=OFF")\n'
                printf 'set(VCPKG_LINKER_FLAGS "-fuse-ld=bfd")\n'
              } | sudo tee "$TRIPLET_FILE" > /dev/null
            fi
          done
          LOONG_TRIPLET="$VCPKG_ROOT/triplets/community/loongarch64-linux.cmake"
          if ! grep -q 'VCPKG_CMAKE_CONFIGURE_OPTIONS' "$LOONG_TRIPLET"; then
            printf 'set(VCPKG_CMAKE_CONFIGURE_OPTIONS "-DUSE_LD_LLD=OFF")\n' | sudo tee -a "$LOONG_TRIPLET" > /dev/null
          fi
          if ! grep -q 'VCPKG_LINKER_FLAGS' "$LOONG_TRIPLET"; then
            printf 'set(VCPKG_LINKER_FLAGS "-fuse-ld=bfd")\n' | sudo tee -a "$LOONG_TRIPLET" > /dev/null
          fi

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-11-arm" ]; then
            # The ARM64 image ships Ninja with Visual Studio; Chocolatey provides an
            # x64 binary if it is missing, which Windows 11 ARM runs under emulation.
            if ! command -v ninja >/dev/null 2>&1; then
              choco install ninja -y
            fi
            ninja --version
          else
            pip install ninja
          fi

      - name: CMake configure
        shell: bash
        run: |
          FLAGS=(
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
            -DNEXUSFORCE_BUILD_DOCS=OFF
            -DCMAKE_CXX_STANDARD=${{ matrix.cppstd }}
          )

          case "${{ matrix.config }}" in
            full) ;;
            minimal)
              FLAGS+=(
                -DNEXUSFORCE_ENABLE_POSTGRESQL=OFF
                -DNEXUSFORCE_ENABLE_MYSQL=OFF
                -DNEXUSFORCE_ENABLE_SQLITE3=OFF
                -DNEXUSFORCE_ENABLE_REDIS=OFF
                -DNEXUSFORCE_ENABLE_ZLIB=OFF
                -DNEXUSFORCE_ENABLE_LZ4=OFF
                -DNEXUSFORCE_USING_SSO=OFF
                -DNEXUSFORCE_USING_INTEL_TSX=OFF
                -DNEXUSFORCE_USING_SQLCIPHER=OFF
                -DNEXUSFORCE_BUILD_TESTS=OFF
                -DNEXUSFORCE_BUILD_EXAMPLES=OFF
                -DNEXUSFORCE_BUILD_BENCHMARKS=OFF
              )
              ;;
            sqlcipher)
              FLAGS+=(
                -DNEXUSFORCE_USING_SQLCIPHER=ON
                -DNEXUSFORCE_BUILD_TESTS=OFF
                -DNEXUSFORCE_BUILD_EXAMPLES=OFF
                -DNEXUSFORCE_BUILD_BENCHMARKS=OFF
              )
              ;;
            all-db)
              FLAGS+=(
                -DNEXUSFORCE_ENABLE_POSTGRESQL=ON
                -DNEXUSFORCE_ENABLE_MYSQL=ON
                -DNEXUSFORCE_ENABLE_SQLITE3=ON
                -DNEXUSFORCE_ENABLE_REDIS=ON
                -DNEXUSFORCE_BUILD_EXAMPLES=OFF
                -DNEXUSFORCE_BUILD_BENCHMARKS=OFF
              )
              ;;
            no-compress)
              FLAGS+=(
                -DNEXUSFORCE_ENABLE_ZLIB=OFF
                -DNEXUSFORCE_ENABLE_LZ4=OFF
                -DNEXUSFORCE_BUILD_EXAMPLES=OFF
                -DNEXUSFORCE_BUILD_BENCHMARKS=OFF
              )
              ;;
            no-icu)
              FLAGS+=(
                -DNEXUSFORCE_ENABLE_ICU=OFF
                -DNEXUSFORCE_BUILD_EXAMPLES=OFF
                -DNEXUSFORCE_BUILD_BENCHMARKS=OFF
              )
              ;;
            no-locale)
              FLAGS+=(
                -DNEXUSFORCE_ENABLE_LOCALE=OFF
                -DNEXUSFORCE_BUILD_EXAMPLES=OFF
                -DNEXUSFORCE_BUILD_BENCHMARKS=OFF
              )
              ;;
            pool-off)
              FLAGS+=(
                -DNEXUSFORCE_USING_MEMORY_POOL=OFF
                -DNEXUSFORCE_BUILD_EXAMPLES=OFF
                -DNEXUSFORCE_BUILD_BENCHMARKS=OFF
              )
              ;;
            pool-tls-global-dynamic)
              FLAGS+=(
                -DCMAKE_CXX_FLAGS=-DNEFORCE_MEMORY_POOL_TLS_GLOBAL_DYNAMIC
                -DNEXUSFORCE_BUILD_EXAMPLES=OFF
                -DNEXUSFORCE_BUILD_BENCHMARKS=OFF
              )
              ;;
            macos-arm64|macos-x64)
              FLAGS+=(
                -DNEXUSFORCE_ENABLE_POSTGRESQL=OFF
                -DNEXUSFORCE_ENABLE_MYSQL=OFF
                -DNEXUSFORCE_ENABLE_SQLITE3=OFF
                -DNEXUSFORCE_ENABLE_REDIS=OFF
                -DNEXUSFORCE_ENABLE_LZ4=OFF
                -DNEXUSFORCE_ENABLE_ZSTD=OFF
                -DNEXUSFORCE_ENABLE_ICU=OFF
                -DNEXUSFORCE_BUILD_EXAMPLES=OFF
                -DNEXUSFORCE_BUILD_BENCHMARKS=OFF
                -DVCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON
                "-DVCPKG_MANIFEST_FEATURES=openssl;pcre2;zlib;gtest"
              )
              ;;
            cross-*)
              FLAGS+=(
                -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
                -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=${GITHUB_WORKSPACE}/cmake/toolchains/${{ matrix.toolchain }}
                -DNEXUSFORCE_BUILD_TESTS=OFF
                -DNEXUSFORCE_BUILD_EXAMPLES=OFF
                -DNEXUSFORCE_BUILD_BENCHMARKS=OFF
              )
              if [ "${{ matrix.cross_deps }}" = "minimal" ]; then
                FLAGS+=(
                  -DNEXUSFORCE_ENABLE_POSTGRESQL=OFF
                  -DNEXUSFORCE_ENABLE_MYSQL=OFF
                  -DNEXUSFORCE_ENABLE_SQLITE3=OFF
                  -DNEXUSFORCE_ENABLE_REDIS=OFF
                  -DNEXUSFORCE_ENABLE_ZLIB=OFF
                  -DNEXUSFORCE_ENABLE_LZ4=OFF
                )
              fi
              ;;
          esac

          if [ -n "${{ matrix.vcpkg_install_options }}" ]; then
            FLAGS+=(-DVCPKG_INSTALL_OPTIONS=${{ matrix.vcpkg_install_options }})
          fi

          COMPILER_FLAGS=()
          if [ "${{ runner.os }}" = "Windows" ] && [ "${{ matrix.compiler }}" = "clang-cl" ]; then
            COMPILER_FLAGS+=(
              -DCMAKE_C_COMPILER=clang-cl
              -DCMAKE_CXX_COMPILER=clang-cl
            )
            if [ -n "${{ matrix.clang_target }}" ]; then
              COMPILER_FLAGS+=(
                -DCMAKE_C_COMPILER_TARGET=${{ matrix.clang_target }}
                -DCMAKE_CXX_COMPILER_TARGET=${{ matrix.clang_target }}
              )
            fi
          elif [ "${{ runner.os }}" != "Windows" ] && [[ "${{ matrix.config }}" != cross-* ]]; then
            if [ "${{ matrix.compiler }}" = "clang" ]; then
              COMPILER_FLAGS+=(
                -DCMAKE_C_COMPILER=clang
                -DCMAKE_CXX_COMPILER=clang++
              )
            else
              COMPILER_FLAGS+=(
                -DCMAKE_C_COMPILER=gcc
                -DCMAKE_CXX_COMPILER=g++
              )
            fi
          fi

          CONFIGURE_LOG=$(mktemp)
          for attempt in 1 2 3; do
            set +e
            cmake -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              "${COMPILER_FLAGS[@]}" \
              "${FLAGS[@]}" 2>&1 | tee "$CONFIGURE_LOG"
            configure_status=${PIPESTATUS[0]}
            set -e
            if [ "$configure_status" -eq 0 ]; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit "$configure_status"
            fi
            if ! grep -qE 'curl operation failed|Couldn.t resolve|BUILD_FAILED' "$CONFIGURE_LOG"; then
              exit "$configure_status"
            fi
            echo "::warning::CMake configure failed on a transient vcpkg download; retrying (attempt $attempt/3)"
            sleep 10
          done

      # Build, verify ABI boundaries, and run tests.
      - name: Build
        shell: bash
        run: |
          BUILD_LOG=$(mktemp)
          set +e
          cmake --build build --config Release --parallel 2>&1 | tee "$BUILD_LOG"
          BUILD_EXIT=${PIPESTATUS[0]}

          if grep -q "Relocations in generic ELF" "$BUILD_LOG" 2>/dev/null; then
            if [[ "${{ matrix.config }}" == cross-* ]]; then
              echo "::warning::vcpkg cross-compiled packages contain host-arch objects (Relocations in generic ELF). This is a vcpkg cross-build limitation, not a project defect. Treated as success."
              exit 0
            fi
          fi

          exit $BUILD_EXIT

      - name: Quick timeout smoke tests (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 5
        shell: bash
        run: |
          ./build/bin/Release/NexusForceUnitTests \
            --gtest_color=no \
            --gtest_filter='Wait.*:FutureAwait.*:ThreadPool.*:ThreadPoolTimerScheduler.*:ChannelTest.*'

      - name: Run death and signal tests (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 30
        shell: bash
        run: |
          ./build/bin/Release/NexusForceUnitTests \
            --gtest_color=no \
            --gtest_output=xml:test-results-death.xml \
            --gtest_filter='*Death*:TerminateTest.*:CrashDumpTest.*'

      - name: Run remaining unit tests (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 30
        shell: bash
        run: |
          ./build/bin/Release/NexusForceUnitTests \
            --gtest_color=no \
            --gtest_output=xml:test-results.xml \
            --gtest_filter='-*Death*:TerminateTest.*:CrashDumpTest.*'

      - name: Check the allocator boundary (Windows)
        if: runner.os == 'Windows' && matrix.compiler == 'msvc' && matrix.config == 'full'
        shell: bash
        run: |
          set -euo pipefail

          dll=build/bin/Release/NexusForce.dll
          exe=build/bin/Release/NexusForceUnitTests.exe

          for artifact in "$dll" "$exe"; do
            if [ ! -f "$artifact" ]; then
              echo "::error::$artifact was not produced"
              exit 1
            fi
          done

          forbidden=(
            '??2@YAPEAX_K@Z'
            '??3@YAXPEAX@Z'
            '??_U@YAPEAX_K@Z'
            '??_V@YAXPEAX@Z'
            '??2@YAPEAX_KW4align_val_t@std@@@Z'
            '??3@YAXPEAXW4align_val_t@std@@@Z'
            '??_U@YAPEAX_KW4align_val_t@std@@@Z'
            '??_V@YAXPEAXW4align_val_t@std@@@Z'
            '??3@YAXPEAX_K@Z'
            '??_V@YAXPEAX_K@Z'
          )

          for symbol in "${forbidden[@]}"; do
            if dumpbin -exports "$dll" | grep -F -- "$symbol"; then
              echo "::error::NexusForce.dll exports the replaceable allocation operator $symbol: consumers"
              echo "::error::would silently use the pool while third party DLLs keep the C runtime heap"
              exit 1
            fi
          done

          from_nexusforce=$(dumpbin -imports "$exe" | awk '
              /^  [A-Za-z0-9_.-]+\.dll[[:space:]]*$/ { module = $1; next }
              module ~ /^NexusForce/ { print }
            ')
          for symbol in "${forbidden[@]}"; do
            if printf '%s\n' "$from_nexusforce" | grep -F -- "$symbol" >/dev/null; then
              echo "::error::the unit test executable imports $symbol from NexusForce.dll"
              exit 1
            fi
          done

          if ! dumpbin -exports "$dll" | grep -q 'system_memory_pool@neforce@@'; then
            echo "::error::NexusForce.dll does not export the pool singleton"
            exit 1
          fi

          echo "the allocator boundary holds: NexusForce.dll exports the pool but no allocation operators"

      - name: Run unit tests
        if: ${{ runner.os != 'macOS' && !startsWith(matrix.config, 'cross-') && matrix.config != 'minimal' && matrix.config != 'sqlcipher' }}
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            exe=build/bin/Release/NexusForceUnitTests.exe
          else
            exe=build/bin/Release/NexusForceUnitTests
          fi
          "$exe" --gtest_color=no --gtest_output=xml:test-results.xml

      # Results, cache and job summary.
      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.config }}
          path: test-results*.xml
          if-no-files-found: ignore

      - name: Save vcpkg binary cache
        uses: ./.github/actions/save-vcpkg-cache
        with:
          cache-key: ${{ steps.vcpkg.outputs.cache-key }}
          archive-fingerprint: ${{ steps.vcpkg.outputs.archive-fingerprint }}
          binary-cache: ${{ steps.vcpkg.outputs.binary-cache }}
          tool-cache-key: ${{ steps.vcpkg.outputs.tool-cache-key }}
          tool-cache-hit: ${{ steps.vcpkg.outputs.tool-cache-hit }}
          vcpkg-tool-cache-path: ${{ steps.vcpkg.outputs.vcpkg-tool-cache-path }}

      - name: Summary
        if: always()
        run: |
          echo "| 项目 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|----|" >> $GITHUB_STEP_SUMMARY
          echo "| 平台 | ${{ runner.os }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 编译器 | ${{ matrix.compiler }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 配置 | ${{ matrix.config }} |" >> $GITHUB_STEP_SUMMARY
          echo "| C++ 标准 | ${{ matrix.cppstd }} |" >> $GITHUB_STEP_SUMMARY
        shell: bash

  freebsd:
    name: "freebsd · ${{ matrix.arch }} · C++20 · qemu (clang + gcc)"
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            triplet: x64-freebsd
            toolchain: x86_64-freebsd-clang.cmake
            release_path: amd64
            qemu_packages: qemu-system-x86

          - arch: arm64
            triplet: arm64-freebsd
            toolchain: arm64-freebsd-clang.cmake
            release_path: arm64/aarch64
            qemu_packages: qemu-system-arm qemu-efi-aarch64

    env:
      FREEBSD_VERSION: "14.4"
      FREEBSD_MIRROR: "https://mirror.nju.edu.cn/freebsd"
      VM_DIR: ${{ github.workspace }}/.ci/freebsd/vm-${{ matrix.arch }}
      SYSROOT: ${{ github.workspace }}/.ci/freebsd/sysroot-${{ matrix.arch }}
      FREEBSD_SYSROOT: ${{ github.workspace }}/.ci/freebsd/sysroot-${{ matrix.arch }}
      VCPKG_INSTALLED: ${{ github.workspace }}/.ci/freebsd/vcpkg-${{ matrix.arch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install QEMU and cross toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang-19 lld-19 rsync xz-utils pkg-config libtirpc-dev \
            cloud-image-utils openssh-client qemu-utils \
            ${{ matrix.qemu_packages }}
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-19 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-19 100

      - name: Setup vcpkg
        id: vcpkg
        uses: ./.github/actions/setup-vcpkg
        with:
          triplet: ${{ matrix.triplet }}
          image: freebsd-${{ env.FREEBSD_VERSION }}-${{ matrix.arch }}

      - name: Restore FreeBSD sysroot
        id: sysroot-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.SYSROOT }}
          key: freebsd-sysroot-${{ env.FREEBSD_VERSION }}-${{ matrix.arch }}-${{ hashFiles('cmake/toolchains/*freebsd*.cmake') }}

      - name: Prepare FreeBSD sysroot
        if: steps.sysroot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$SYSROOT"
          curl -fSL --retry 5 --retry-delay 3 \
            "$FREEBSD_MIRROR/releases/${{ matrix.release_path }}/$FREEBSD_VERSION-RELEASE/base.txz" \
            -o /tmp/base.txz
          tar -xJf /tmp/base.txz -C "$SYSROOT"

      - name: Save FreeBSD sysroot
        if: steps.sysroot-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.SYSROOT }}
          key: freebsd-sysroot-${{ env.FREEBSD_VERSION }}-${{ matrix.arch }}-${{ hashFiles('cmake/toolchains/*freebsd*.cmake') }}

      - name: Restore FreeBSD QEMU VM image and configuration
        id: vm-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VM_DIR }}
          key: freebsd-vm-${{ env.FREEBSD_VERSION }}-${{ matrix.arch }}-${{ hashFiles('scripts/ci/freebsd-qemu.sh') }}

      - name: Prepare and provision FreeBSD QEMU VM
        if: steps.vm-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          bash scripts/ci/freebsd-qemu.sh "${{ matrix.arch }}" provision \
            "$VM_DIR" "$VM_DIR/id_ed25519" 2222

      - name: Save FreeBSD QEMU VM image and configuration
        if: steps.vm-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VM_DIR }}
          key: freebsd-vm-${{ env.FREEBSD_VERSION }}-${{ matrix.arch }}-${{ hashFiles('scripts/ci/freebsd-qemu.sh') }}

      - name: Restore FreeBSD vcpkg dependencies
        id: vcpkg-installed-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_INSTALLED }}
          key: freebsd-vcpkg-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/triplets/*freebsd*.cmake', 'cmake/toolchains/*freebsd*.cmake') }}

      - name: Use baseline SIMD for FreeBSD x64 QEMU
        if: matrix.arch == 'x64'
        run: |
          python3 - <<'PY'
          import json
          with open('config.json', encoding='utf-8') as handle:
              config = json.load(handle)
          config['simd']['x64'] = 'BASELINE'
          config['feature']['aes-ni'] = False
          config['feature']['pclmul'] = False
          with open('config.json', 'w', encoding='utf-8') as handle:
              json.dump(config, handle, indent=2)
              handle.write('\n')
          PY

      - name: Build host NFRS
        run: |
          set -euo pipefail
          cmake -B build-host -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DNEXUSFORCE_BUILD_DOCS=OFF \
            -DNEXUSFORCE_BUILD_TESTS=OFF \
            -DNEXUSFORCE_BUILD_EXAMPLES=OFF \
            -DNEXUSFORCE_BUILD_BENCHMARKS=OFF
          cmake --build build-host --target NFRS --parallel 2
          HOST_NFRS=$(find build-host/bin -type f -name NFRS | head -1)
          test -n "$HOST_NFRS"
          echo "NEXUSFORCE_HOST_NFRS=$PWD/$HOST_NFRS" >> "$GITHUB_ENV"

      - name: Configure FreeBSD cross build
        run: |
          set -euo pipefail
          cmake -B build-freebsd -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$PWD/cmake/toolchains/${{ matrix.toolchain }}" \
            -DVCPKG_OVERLAY_TRIPLETS="$PWD/cmake/triplets" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED" \
            -DFREEBSD_SYSROOT="$SYSROOT" \
            -DNEXUSFORCE_HOST_NFRS="$NEXUSFORCE_HOST_NFRS" \
            -DNEXUSFORCE_BUILD_DOCS=OFF \
            -DNEXUSFORCE_BUILD_EXAMPLES=OFF \
            -DNEXUSFORCE_BUILD_BENCHMARKS=OFF

      - name: Build FreeBSD unit tests
        run: cmake --build build-freebsd --target NexusForceUnitTests --parallel 2

      - name: Save FreeBSD vcpkg dependencies
        if: steps.vcpkg-installed-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_INSTALLED }}
          key: freebsd-vcpkg-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/triplets/*freebsd*.cmake', 'cmake/toolchains/*freebsd*.cmake') }}

      - name: Save vcpkg binary cache
        uses: ./.github/actions/save-vcpkg-cache
        with:
          cache-key: ${{ steps.vcpkg.outputs.cache-key }}
          archive-fingerprint: ${{ steps.vcpkg.outputs.archive-fingerprint }}
          binary-cache: ${{ steps.vcpkg.outputs.binary-cache }}
          tool-cache-key: ${{ steps.vcpkg.outputs.tool-cache-key }}
          tool-cache-hit: ${{ steps.vcpkg.outputs.tool-cache-hit }}
          vcpkg-tool-cache-path: ${{ steps.vcpkg.outputs.vcpkg-tool-cache-path }}

      - name: Boot FreeBSD QEMU VM
        run: |
          set -euo pipefail
          bash scripts/ci/freebsd-qemu.sh "${{ matrix.arch }}" boot \
            "$VM_DIR" "$VM_DIR/id_ed25519" 2222
          bash scripts/ci/freebsd-qemu.sh "${{ matrix.arch }}" wait \
            "$VM_DIR" "$VM_DIR/id_ed25519" 2222 tester

      - name: Copy FreeBSD test binaries into the VM
        run: |
          set -euo pipefail
          SSH=(ssh -i "$VM_DIR/id_ed25519" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -p 2222)
          SCP=(scp -i "$VM_DIR/id_ed25519" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -P 2222)

          echo "FreeBSD build artefacts:"
          find build-freebsd/bin build-freebsd/lib -maxdepth 4 -type f             \( -name NexusForceUnitTests -o -name 'libNexusForce*.so*' -o -name NexusForceTestPlugin.so \) \
            -printf '  %p\n' || true

          TEST_BIN=$(find build-freebsd/bin -type f -name NexusForceUnitTests -print -quit)
          LIB=$(find build-freebsd/lib -type f -name 'libNexusForce*.so.*.*' -print -quit)
          PLUGIN=$(find build-freebsd/lib -type f -name NexusForceTestPlugin.so -print -quit)

          # Do not use 'test -n a && test -n b': a failing non-final command in an
          # AND list is ignored by set -e, so an empty path reached scp below.
          if [ -z "$TEST_BIN" ]; then
            echo "::error::NexusForceUnitTests was not produced under build-freebsd/bin"
            exit 1
          fi
          if [ -z "$LIB" ]; then
            echo "::error::libNexusForce*.so.* was not produced under build-freebsd/lib"
            exit 1
          fi
          if [ -z "$PLUGIN" ]; then
            echo "::error::NexusForceTestPlugin.so was not produced under build-freebsd/lib"
            exit 1
          fi

          PLUGIN_DST="$PWD/$PLUGIN"
          "${SSH[@]}" root@127.0.0.1 "mkdir -p /tmp/nf/bin /tmp/nf/lib '$(dirname "$PLUGIN_DST")' && chown -R tester /tmp/nf"
          "${SSH[@]}" tester@127.0.0.1 "mkdir -p /tmp/nf/snapshots"
          "${SCP[@]}" "$TEST_BIN" tester@127.0.0.1:/tmp/nf/bin/
          "${SCP[@]}" "$LIB" tester@127.0.0.1:/tmp/nf/lib/libNexusForce.so.2
          "${SCP[@]}" "$PLUGIN" tester@127.0.0.1:/tmp/nf/NexusForceTestPlugin.so
          "${SCP[@]}" -r tests/unit/snapshots/. tester@127.0.0.1:/tmp/nf/snapshots/
          "${SSH[@]}" root@127.0.0.1 "cp /tmp/nf/NexusForceTestPlugin.so '$PLUGIN_DST' && chmod 644 '$PLUGIN_DST'"

      - name: Run FreeBSD unit tests under QEMU
        run: |
          set +e
          SSH=(ssh -i "$VM_DIR/id_ed25519" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -p 2222)
          SCP=(scp -i "$VM_DIR/id_ed25519" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -P 2222)
          "${SSH[@]}" tester@127.0.0.1 \
            "cd /tmp/nf && LD_LIBRARY_PATH=/tmp/nf/lib NEFORCE_SNAPSHOT_DIR=/tmp/nf/snapshots timeout 3600 ./bin/NexusForceUnitTests --gtest_color=no --gtest_output=xml:/tmp/nf/results.xml"
          status=$?
          "${SCP[@]}" tester@127.0.0.1:/tmp/nf/results.xml "freebsd-${{ matrix.arch }}-test-results.xml" || true
          cp "$VM_DIR/serial.log" "freebsd-${{ matrix.arch }}-serial.log" 2>/dev/null || true
          exit $status

      - name: Upload FreeBSD test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freebsd-${{ matrix.arch }}-test-results
          path: |
            freebsd-${{ matrix.arch }}-test-results.xml
            freebsd-${{ matrix.arch }}-serial.log
          if-no-files-found: ignore

      - name: Build and run FreeBSD GCC unit tests
        run: |
          bash scripts/ci/freebsd-gcc.sh \
            "${{ matrix.arch }}" "$VM_DIR" 2222 "$PWD" "$VCPKG_INSTALLED" "${{ matrix.triplet }}"

      - name: Collect FreeBSD GCC logs
        if: always()
        run: |
          cp "$VM_DIR/serial.log" "freebsd-gcc-${{ matrix.arch }}-serial.log" 2>/dev/null || true

      - name: Upload FreeBSD GCC test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freebsd-gcc-${{ matrix.arch }}-test-results
          path: |
            freebsd-gcc-${{ matrix.arch }}-test-results.xml
            freebsd-gcc-${{ matrix.arch }}-serial.log
          if-no-files-found: ignore

      - name: Power off FreeBSD QEMU VM
        if: always()
        run: |
          bash scripts/ci/freebsd-qemu.sh "${{ matrix.arch }}" poweroff \
            "$VM_DIR" "$VM_DIR/id_ed25519" 2222 || true

      - name: Summary
        if: always()
        run: |
          echo "| 项目 | 值 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|----|" >> "$GITHUB_STEP_SUMMARY"
          echo "| 平台 | FreeBSD ${{ env.FREEBSD_VERSION }} ${{ matrix.arch }} · QEMU TCG |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 编译器 | clang（交叉）+ gcc 13（VM 内原生） |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 依赖 | vcpkg ${{ matrix.triplet }}（交叉） |" >> "$GITHUB_STEP_SUMMARY"

  allocator:
    name: "allocator · global new/delete override (gcc · Release)"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies (Ubuntu)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential      \
            cmake                \
            ninja-build          \
            pkg-config           \
            libtirpc-dev         \
            liburing-dev         \
            curl                 \
            zip                  \
            unzip                \
            tar

      - name: Setup vcpkg
        id: vcpkg
        uses: ./.github/actions/setup-vcpkg
        with:
          triplet: x64-linux
          image: ubuntu-24.04

      - name: CMake configure
        shell: bash
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DNEXUSFORCE_BUILD_DOCS=OFF \
            -DNEXUSFORCE_BUILD_EXAMPLES=OFF \
            -DNEXUSFORCE_BUILD_BENCHMARKS=OFF \
            -DNEXUSFORCE_MEMORY_POOL_GLOBAL_OVERRIDE=ON

      - name: Build library and allocator test targets
        shell: bash
        run: |
          cmake --build build --parallel --target \
            NexusForce NexusForceUnitTests NexusForceMemoryPoolOverrideStatic NexusForceAllocatorOverrideTest

      - name: Run memory pool unit tests
        shell: bash
        run: |
          ./build/bin/Release/NexusForceUnitTests --gtest_filter='MemoryPool*:PoolAllocator*'

      - name: Run global override integration test
        shell: bash
        run: |
          ./build/bin/Release/NexusForceAllocatorOverrideTest

      - name: Verify the shared library leaves the global operators alone
        shell: bash
        run: |
          set -euo pipefail

          library=$(find build -name 'libNexusForce.so' -not -path '*vcpkg*' | head -1)
          if [ -z "$library" ]; then
            echo "::error::libNexusForce.so was not produced"
            exit 1
          fi
          echo "checking $library"

          if nm -D --defined-only "$library" | grep -E ' (_Znwm|_Znam|_ZdlPv|_ZdaPv)(m|St11align_val_t|St11align_val_tm|RKSt9nothrow_t|St11align_val_tRKSt9nothrow_t)?$'; then
            echo "::error::the shared library defines the global allocation operators, so every consumer"
            echo "::error::and every other shared library is silently moved onto a second heap"
            exit 1
          fi

          if ! nm -D --defined-only "$library" | grep -q '_ZN7neforce18system_memory_poolEv'; then
            echo "::error::system_memory_pool() is not exported; consumers cannot reach the pool"
            exit 1
          fi

          echo "the library exports the pool singleton and does not replace the global operators"

      - name: Save vcpkg binary cache
        uses: ./.github/actions/save-vcpkg-cache
        with:
          cache-key: ${{ steps.vcpkg.outputs.cache-key }}
          archive-fingerprint: ${{ steps.vcpkg.outputs.archive-fingerprint }}
          binary-cache: ${{ steps.vcpkg.outputs.binary-cache }}
          tool-cache-key: ${{ steps.vcpkg.outputs.tool-cache-key }}
          tool-cache-hit: ${{ steps.vcpkg.outputs.tool-cache-hit }}
          vcpkg-tool-cache-path: ${{ steps.vcpkg.outputs.vcpkg-tool-cache-path }}

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "| 项目 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|----|" >> $GITHUB_STEP_SUMMARY
          echo "| 平台 | ubuntu-24.04 |" >> $GITHUB_STEP_SUMMARY
          echo "| 编译器 | gcc |" >> $GITHUB_STEP_SUMMARY
          echo "| 配置 | NEXUSFORCE_MEMORY_POOL_GLOBAL_OVERRIDE=ON |" >> $GITHUB_STEP_SUMMARY
          echo "| 覆盖生效验证 | new/delete 计入 system_memory_pool() 统计 |" >> $GITHUB_STEP_SUMMARY
