name: "Format Check"

on:
  push:
    branches: [ dev ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'examples/**'
      - '.clang-format'
  pull_request:
    branches: [ dev ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'examples/**'
      - '.clang-format'

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-17
          sudo ln -sf /usr/bin/clang-format-17 /usr/bin/clang-format

      - name: Run clang-format check
        run: |
          find src include tests examples \
            -type f \( -name "*.cpp" -o -name "*.hpp" -o -name "*.h" \) \
            ! -path "*/build/*" ! -path "*/vcpkg_installed/*" \
            -print0 > filelist.txt
          
          xargs -0 clang-format --dry-run --Werror -style=file < filelist.txt
          
          echo "✅ All files are properly formatted!"
