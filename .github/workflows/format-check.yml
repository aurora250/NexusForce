name: "Format Check"

on:
  push:
    branches: [ dev ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'examples/**'
      - 'tools/**'
      - 'benchmark/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'vcpkg.json'
      - 'config.json'
      - '.github/workflows/format-check.yml'
      - '.clang-format'
  pull_request:
    branches: [ dev ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'examples/**'
      - 'tools/**'
      - 'benchmark/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'vcpkg.json'
      - 'config.json'
      - '.github/workflows/format-check.yml'
      - '.clang-format'
  workflow_dispatch:

jobs:
  format-check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install clang-format-19
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-format-19
          sudo ln -sf /usr/bin/clang-format-19 /usr/bin/clang-format
          clang-format --version

      - name: Run clang-format check
        run: |
          find src include examples \
            -type f \( -name "*.cpp" -o -name "*.hpp" -o -name "*.h" \) \
            ! -path "*/build/*" ! -path "*/vcpkg_installed/*" \
            -exec clang-format --dry-run --Werror -style=file {} +
          
          echo "✅ All files are properly formatted!"
