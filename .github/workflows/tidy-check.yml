name: "Clang-Tidy Check"

on:
  push:
    branches: [ dev ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'examples/**'
      - 'tools/**'
      - 'benchmark/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'vcpkg.json'
      - 'config.json'
      - '.github/workflows/tidy-check.yml'
      - '.clang-tidy'
  pull_request:
    branches: [ dev ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'examples/**'
      - 'tools/**'
      - 'benchmark/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'vcpkg.json'
      - 'config.json'
      - '.github/workflows/tidy-check.yml'
      - '.clang-tidy'
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  clang-tidy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install clang-tidy-19
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-tidy-19
          sudo ln -sf /usr/bin/clang-tidy-19 /usr/bin/clang-tidy
          clang-tidy --version

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential ninja-build libtirpc-dev libc++abi-dev liburing-dev

      - name: Setup vcpkg
        id: vcpkg
        uses: ./.github/actions/setup-vcpkg

      - name: Configure CMake (with clang-tidy and compile commands)
        run: |
          cmake -B ${{ github.workspace }}/build \
            -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DNEXUSFORCE_BUILD_DOCS=OFF \
            -DNEXUSFORCE_BUILD_TESTS=OFF

      - name: Save vcpkg binary cache
        uses: ./.github/actions/save-vcpkg-cache
        with:
          cache-key: ${{ steps.vcpkg.outputs.cache-key }}
          cache-hit: ${{ steps.vcpkg.outputs.cache-hit }}
          binary-cache: ${{ steps.vcpkg.outputs.binary-cache }}
          tool-cache-key: ${{ steps.vcpkg.outputs.tool-cache-key }}
          tool-cache-hit: ${{ steps.vcpkg.outputs.tool-cache-hit }}
          vcpkg-tool-cache-path: ${{ steps.vcpkg.outputs.vcpkg-tool-cache-path }}

      - name: Run clang-tidy
        run: |
          cmake --build ${{ github.workspace }}/build --target tidy

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-report
          path: ${{ github.workspace }}/build/clang_tidy_report.txt
